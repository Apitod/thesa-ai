# ============================================================
# Thesa AI — Render Blueprint Infrastructure as Code
# Auto-deploys Docker Container to Singapore Region
# ============================================================

services:
  - type: web
    name: thesa-ai
    env: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: AI_PRIMARY_PROVIDER
        value: deepseek
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: false
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
