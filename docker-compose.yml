# ============================================================
# Thesa AI — Docker Compose Infrastructure Stack
# ============================================================

services:
  thesa-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thesa_ai_app
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
      - MIDTRANS_MERCHANT_ID=${MIDTRANS_MERCHANT_ID}
      - MYSQL_DSN=root:${MYSQL_ROOT_PASSWORD:-thesapassword}@tcp(thesa-db:3306)/risethub?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      thesa-db:
        condition: service_healthy
    networks:
      - thesa-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  thesa-db:
    image: mysql:8.0
    container_name: thesa_ai_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-thesapassword}
      MYSQL_DATABASE: risethub
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - thesa_db_data:/var/lib/mysql
      - ./internal/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - thesa-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-thesapassword} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  thesa-network:
    driver: bridge

volumes:
  thesa_db_data:
    driver: local
