# ============================================================
# Thesa AI — Koyeb Deployment Blueprint
# Auto-deploys Docker Container to Singapore (SIN) Region
# ============================================================

name: thesa-ai
services:
  - name: thesa-backend
    type: web
    regions:
      - sin
    plan: nano
    docker:
      dockerfile: Dockerfile
    ports:
      - port: 8080
        path: /
        protocol: http
    health_checks:
      - http:
          path: /health
          port: 8080
        interval: 30
        timeout: 5
        unhealthy_threshold: 3
        healthy_threshold: 1
    routes:
      - path: /
        port: 8080
    env:
      - key: PORT
        value: "8080"
      - key: AI_PRIMARY_PROVIDER
        value: "gemini"
      - key: DEEPSEEK_MODEL
        value: "deepseek-chat"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"
      - key: ADMIN_SECRET_KEY
        value: "thesa_admin_super_secret_2026"
